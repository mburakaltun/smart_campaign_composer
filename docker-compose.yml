name: smart-campaign-composer

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: composer
      POSTGRES_PASSWORD: composer
      POSTGRES_DB: composer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U composer -d composer"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Fake SMS/email gateway: random latency, 5xx, 429, lost replies, Idempotency-Key support.
  mock-provider:
    build: { context: ./backend, target: mockprovider }
    environment:
      PORT: "9090"
      PROVIDER_ERROR_RATE: ${PROVIDER_ERROR_RATE:-0.05}
      PROVIDER_429_RATE: ${PROVIDER_429_RATE:-0.03}
      PROVIDER_TIMEOUT_RATE: ${PROVIDER_TIMEOUT_RATE:-0.005}
      PROVIDER_LIMIT_PER_SEC: ${PROVIDER_LIMIT_PER_SEC:-150}
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: { context: ./backend, target: api }
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://composer:composer@db:5432/composer?sslmode=disable
      PROVIDER_URL: http://mock-provider:9090
      # Without a key the API uses the built-in mock LLM, so the demo works offline.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      SEED_USERS: ${SEED_USERS:-4000}
      RATE_PER_SEC: ${RATE_PER_SEC:-100}
    depends_on:
      db: { condition: service_healthy }
      mock-provider: { condition: service_healthy }
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build: ./web
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8080:80"

  # `make test-integration`: Go tests that need a real Postgres.
  backend-test:
    profiles: ["test"]
    image: golang:1.24
    working_dir: /src
    volumes:
      - ./backend:/src
      - gomod:/go/pkg/mod
    environment:
      TEST_DATABASE_URL: postgres://composer:composer@db:5432/composer?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "go mod tidy && go test -count=1 ./internal/store/..."

volumes:
  pgdata:
  gomod:
